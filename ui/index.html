<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Alert Analysis</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 2rem; background: #f3f4f6; color: #1f2937; }
    .container { max-width: 900px; margin: auto; padding: 1.5rem; background: white; border-radius: 12px; box-shadow: 0 2px 10px #0001; }
    textarea { box-sizing: border-box; width: 100%; min-height: 8rem; padding: .75rem; border: 1px solid #9ca3af; border-radius: 7px; }
    button { margin-top: .75rem; padding: .65rem 1rem; border: 0; border-radius: 7px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .results { margin-top: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
    .card { margin-top: .75rem; padding: 1rem; border: 1px solid #d1d5db; border-radius: 8px; background: #f9fafb; }
    .review { color: #92400e; font-weight: 700; }
    .ok { color: #047857; font-weight: 700; }
    .error { color: #b42318; }
    .disclaimer { margin-top: 2rem; padding: 1rem; border-left: 4px solid #dc2626; background: #fef2f2; }
  </style>
</head>
<body>
  <!-- Layout และ analyst workflow เริ่มจาก UI ของ Stream D เดิม -->
  <main class="container">
    <h1>ระบบวิเคราะห์ Security Alert</h1>
    <!-- 1. โซนกรอกข้อมูล Alert (Narrative) -->
    <section>
      <label for="narrative-input"><strong>Narrative (ข้อความแจ้งเตือน)</strong></label>
      <textarea id="narrative-input" maxlength="20000" placeholder="ใส่ข้อความแจ้งเตือนที่นี่..."></textarea>
      <button id="analyze-button" type="button">วิเคราะห์ข้อมูล</button>
      <p id="error-message" class="error" role="alert" hidden></p>
    </section>
    <!-- 2. โซนแสดงผลลัพธ์ (Prediction & Evidence) -->
    <section id="results-section" class="results" hidden>
      <h2>ผลการวิเคราะห์</h2>
      <p>Alert ID: <code id="ui-alert-id"></code></p>
      <div id="ui-predictions" class="grid"></div>
      <!-- 3. สถานะตรวจสอบและ Candidate List -->
      <p id="ui-review"></p>
      <h3>Candidate List (ตัวเลือกที่พิจารณา)</h3>
      <ul id="ui-candidates"></ul>
    </section>
    <!-- 4. Disclaimer แสดงเสมอตามข้อกำหนด -->
    <aside class="disclaimer">
      <strong>Disclaimer:</strong>
      <span id="ui-disclaimer">ผลลัพธ์นี้เป็นเพียงคำแนะนำ ต้องมีการตรวจสอบโดยมนุษย์ก่อนดำเนินการใด ๆ</span>
    </aside>
  </main>
  <script>
    const input = document.getElementById("narrative-input");
    const button = document.getElementById("analyze-button");
    const resultsSection = document.getElementById("results-section");
    const errorMessage = document.getElementById("error-message");

    function appendText(parent, tagName, value) {
      const element = document.createElement(tagName);
      element.textContent = value;
      parent.appendChild(element);
      return element;
    }

    function renderPrediction(parent, technique) {
      const card = document.createElement("article");
      card.className = "card";
      appendText(card, "h3", `${technique.technique_id} — ${technique.technique_name}`);
      appendText(card, "p", `Tactic: ${technique.tactic}`);
      appendText(card, "p", `Confidence: ${(technique.confidence * 100).toFixed(0)}%`);
      appendText(card, "p", `Evidence: ${technique.evidence_spans.join(" | ") || "ไม่มีหลักฐานที่ผ่านการตรวจ"}`);
      const link = appendText(card, "a", "เปิดหน้า MITRE ATT&CK");
      link.href = technique.mitre_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      parent.appendChild(card);
    }

    button.addEventListener("click", async () => {
      const narrative = input.value.trim();
      if (!narrative) {
        errorMessage.textContent = "กรุณากรอกข้อความแจ้งเตือนก่อนวิเคราะห์";
        errorMessage.hidden = false;
        return;
      }
      button.disabled = true;
      button.textContent = "กำลังเชื่อมต่อ API...";
      errorMessage.hidden = true;
      resultsSection.hidden = true;
      try {
        const response = await fetch("/alerts/infer", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({narrative})
        });
        const data = await response.json();
        if (!response.ok) {
          const message = data.detail?.message || "เกิดข้อผิดพลาดในการวิเคราะห์";
          const requestId = response.headers.get("X-Request-ID");
          throw new Error(requestId ? `${message} (Request ID: ${requestId})` : message);
        }
        document.getElementById("ui-alert-id").textContent = data.alert_id;
        const predictions = document.getElementById("ui-predictions");
        predictions.replaceChildren();
        if (data.inferred_techniques.length === 0) {
          appendText(predictions, "p", "ไม่พบ Technique ที่มีหลักฐานเพียงพอ");
        } else {
          data.inferred_techniques.forEach(item => renderPrediction(predictions, item));
        }
        const review = document.getElementById("ui-review");
        review.textContent = data.needs_human_review ? "Needs Human Review" : "ผ่าน structural grounding";
        review.className = data.needs_human_review ? "review" : "ok";
        const candidates = document.getElementById("ui-candidates");
        candidates.replaceChildren();
        if (data.candidates_considered.length === 0) {
          appendText(candidates, "li", "ไม่มี candidate");
        } else {
          data.candidates_considered.forEach(candidate => {
            appendText(candidates, "li", `${candidate.technique_id} — ${candidate.technique_name} (${candidate.tactic})`);
          });
        }
        document.getElementById("ui-disclaimer").textContent = data.disclaimer;
        resultsSection.hidden = false;
      } catch (error) {
        errorMessage.textContent = error instanceof Error ? error.message : "เกิดข้อผิดพลาดในการวิเคราะห์";
        errorMessage.hidden = false;
      } finally {
        button.disabled = false;
        button.textContent = "วิเคราะห์ข้อมูล";
      }
    });
  </script>
</body>
</html>
